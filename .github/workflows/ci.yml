name: CI

on:
  push:
    branches: [main, master, "repair/**"]
  pull_request:

jobs:
  worker:
    name: Worker tests + audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lead-rescue-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: lead-rescue-worker/package-lock.json
      - run: npm ci
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Security-focused unit tests
        env:
          CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE: postgresql://test:test@127.0.0.1:5432/test
          NODE_OPTIONS: --use-system-ca
        run: npm run test:security

  mobile:
    name: Mobile typecheck + audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: logistica-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: logistica-app/package-lock.json
      - run: npm ci
      - name: Production dependency audit
        # Expo SDK 54 still pulls moderate toolchain issues (postcss/uuid) that
        # require a major Expo bump; gate only on critical for now.
        run: npm audit --omit=dev --audit-level=critical
        continue-on-error: true
      - run: npm run typecheck

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
